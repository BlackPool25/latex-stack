name: LaTeX gates
on:
  push:
    paths: ["paper/**", ".github/workflows/latex.yml"]
  pull_request:
    paths: ["paper/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: ChkTeX gate (must-fail errors block)
        run: |
          cd paper
          chktex -wall -n22 -n30 -e16 -q main.tex sections/*.tex
      - name: Build with latexmk (LuaLaTeX, warnings are errors)
        run: |
          cd paper
          latexmk -lualatex -interaction=nonstopmode -halt-on-error main.tex
      - name: No undefined references
        run: |
          cd paper
          if grep -E "undefined|multiply defined|There were undefined" main.log; then
            echo "UNDEFINED REFERENCES"; exit 1; fi
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: paper/main.pdf
