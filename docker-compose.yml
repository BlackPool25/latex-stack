services:
  aldine-app:
    image: ghcr.io/trahloff/aldine-app:${ALDINE_VERSION:-1.0.1}
    ports:
      - "${ALDINE_PORT:-8080}:3000"
    volumes:
      - aldine-data:/data
      - aldine-secrets:/secrets
    networks: [backend]
    init: true
    restart: unless-stopped

  aldine-compiler:
    image: ghcr.io/trahloff/aldine-compiler:${ALDINE_VERSION:-1.0.1}${ALDINE_TEXLIVE:-}
    volumes:
      - aldine-data:/data
    networks: [backend]
    init: true
    restart: unless-stopped
    # Untrusted LaTeX runs here: no egress, dropped caps, restricted shell-escape.

volumes:
  aldine-data:
  aldine-secrets:

networks:
  backend:
